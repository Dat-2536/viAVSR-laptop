
dataset:
  repository_id: nguyenvulebinh/ViCocktail
  default_split: train

audio:
  target_sample_rate: 16000   # in Hz (standard in AVSR/ASR)
  format: s16
  layout: mono

mouth_roi:
  size: 96                     # px, theo cấu hình AV-HuBERT trong paper gốc
  landmarks: [61, 291, 0, 17, 269, 405]

text:
  keep_diacritics: true

model:
  repository_id: nguyenvulebinh/AV-HuBERT-CTC-Attention-VI
  revision: b8a1fa5d6079701b3f8f791bfd601057fbd23de3
  cache_dir: .cache/models
  device: cuda
  dtype: float32

tokenizer:
  model_path: assets/tokenizers/vi/unigram2048.model
  units_path: assets/tokenizers/vi/unigram2048_units.txt

paths:
  samples_dir: /samples/official